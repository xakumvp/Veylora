# Keeps pinned dependencies up to date via reviewable pull requests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint declares a narrow peer range for TypeScript; bump TS minors
      # by hand together with typescript-eslint once it supports the new version.
      - dependency-name: typescript
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
    groups:
      frontend-minor:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor:
        update-types: [minor, patch]
