name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test, build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install
        working-directory: frontend
        run: npm ci

      - name: Frontend — audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Frontend — lint, format, typecheck
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check
          npm run typecheck

      - name: Frontend — build
        working-directory: frontend
        run: npm run build

      - name: Go — verify module checksums
        run: go mod verify

      - name: Go — vet
        run: go vet . ./internal/...

      - name: Go — test
        run: go test -count=1 ./internal/...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Build Windows app
        run: wails build -skipbindings -ldflags "-X main.version=ci-${{ github.sha }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Veylora-windows-${{ github.sha }}
          path: build/bin/Veylora.exe
          retention-days: 14
